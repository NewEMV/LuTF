name: Deploy para Firebase (Hosting + Functions)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências do Projeto
        run: npm ci

      - name: 🏗️ Build do Next.js
        run: npm run build

      - name: 📦 Instalar Dependências das Functions
        working-directory: ./functions
        run: npm install

      - name: 🚀 Preparar SSR (Copy .next para Functions)
        run: |
          rm -rf functions/.next
          cp -r .next functions/

      - name: ☁️ Deploy para o Firebase
        run: |
          npx firebase-tools deploy --only hosting,functions --project lucianatf-8395f
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUCIANATF_8395F }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }} # Se possuir o token, caso contrário as credenciais acima devem bastar
